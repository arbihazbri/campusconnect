spring.application.name=backend
spring.application.name=backend

# Connexion PostgreSQL : les valeurs viennent de variables d'environnement.
# Le mot de passe n'a volontairement AUCUNE valeur par défaut.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:campusconnect}
spring.datasource.username=${DB_USERNAME:campusconnect_user}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true